name: iOS

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  # Allows on-demand build validation of any branch (e.g. from a non-Mac machine):
  #   gh workflow run ios.yml --ref <branch>
  workflow_dispatch:

# Least privilege: CI only reads the checkout. Without this block the
# GITHUB_TOKEN falls back to the repository default, which may be read/write.
permissions:
  contents: read

jobs:
  build:
    name: Lint, build & test (iOS)
    runs-on: macos-latest
    env:
      SCHEME: "lead track"
      PROJECT: "lead track.xcodeproj"

    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      - name: Install linters (pinned)
        # Pinned versions + checksums instead of `brew install`: a floating
        # "latest" linter can break every branch overnight with no code
        # change, and would execute unverified just-published code in CI.
        # Keep these in sync with the versions developers install locally
        # (see CLAUDE.md "Linting").
        env:
          SWIFTLINT_VERSION: 0.63.3
          SWIFTLINT_SHA256: fb045e85e7cb3374f42a4840b6b85a0106302afa69035c0c6f29af4a44c810b6
          SWIFTFORMAT_VERSION: 0.61.1
          SWIFTFORMAT_SHA256: b990400779aceb7d7020796eb9ba814d4480543f671d38fc0ff48cb72f04c584
        run: |
          set -euo pipefail
          tools="$RUNNER_TEMP/lint-tools"
          mkdir -p "$tools" && cd "$tools"
          curl -fsSL -o portable_swiftlint.zip \
            "https://github.com/realm/SwiftLint/releases/download/${SWIFTLINT_VERSION}/portable_swiftlint.zip"
          echo "${SWIFTLINT_SHA256}  portable_swiftlint.zip" | shasum -a 256 -c -
          unzip -o -q portable_swiftlint.zip swiftlint
          curl -fsSL -o swiftformat.zip \
            "https://github.com/nicklockwood/SwiftFormat/releases/download/${SWIFTFORMAT_VERSION}/swiftformat.zip"
          echo "${SWIFTFORMAT_SHA256}  swiftformat.zip" | shasum -a 256 -c -
          unzip -o -q swiftformat.zip swiftformat
          chmod +x swiftlint swiftformat
          echo "$tools" >> "$GITHUB_PATH"
          ./swiftlint --version && ./swiftformat --version

      - name: SwiftFormat (lint only)
        run: swiftformat --lint .

      - name: SwiftLint
        run: swiftlint

      - name: Select newest Xcode
        # Runner images now ship iOS simulators only for their newest Xcode, so
        # pick it (also keeps the test SDK current with the iOS 26.2 target).
        run: |
          set -euo pipefail
          newest="$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -1 || true)"
          [ -n "$newest" ] && sudo xcode-select -s "$newest/Contents/Developer"
          xcodebuild -version

      - name: Select simulator
        id: sim
        # Hardcoding a device name (e.g. "iPhone 16") breaks whenever the image
        # changes its preinstalled simulators. Ask xcodebuild itself which
        # simulators it can target (its own source of truth) and take the first
        # — any iOS device works for a compile + unit-test run. If the image
        # ships none, fall back to a generic simulator so compilation is still
        # validated (the test run is then skipped).
        run: |
          set -euo pipefail
          id="$(xcodebuild -showdestinations -scheme "$SCHEME" -project "$PROJECT" 2>/dev/null \
            | grep 'platform:iOS Simulator' | grep -v placeholder \
            | grep -oE 'id:[0-9A-Fa-f-]{36}' | head -1 | cut -d: -f2 || true)"
          if [ -n "$id" ]; then
            echo "Using simulator $id"
            echo "DESTINATION=platform=iOS Simulator,id=$id" >> "$GITHUB_ENV"
            echo "have_sim=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::No bootable iOS simulator on the runner; compiling for a generic simulator and skipping the test run."
            echo "DESTINATION=generic/platform=iOS Simulator" >> "$GITHUB_ENV"
            echo "have_sim=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build for testing
        run: xcodebuild build-for-testing -scheme "$SCHEME" -project "$PROJECT" -destination "$DESTINATION"

      - name: Test
        if: steps.sim.outputs.have_sim == 'true'
        run: xcodebuild test-without-building -scheme "$SCHEME" -project "$PROJECT" -destination "$DESTINATION"

  # The overlay SwiftPM package (Package.swift) compiles the platform-neutral
  # subset of Shared/ so domain logic builds and tests on Linux dev boxes.
  # This job keeps that subset from rotting; the Swift version matches the
  # toolchain used locally and the one bundled with Xcode on macos-latest.
  linux:
    name: Build & test (Linux SwiftPM)
    runs-on: ubuntu-latest
    container: swift:6.1
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      - name: Test
        run: swift test
