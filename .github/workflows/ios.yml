name: iOS

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  # Allows on-demand build validation of any branch (e.g. from a non-Mac machine):
  #   gh workflow run ios.yml --ref <branch>
  workflow_dispatch:

jobs:
  build:
    name: Lint, build & test (iOS)
    runs-on: macos-latest
    env:
      SCHEME: "lead track"
      PROJECT: "lead track.xcodeproj"

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install linters
        run: brew install swiftlint swiftformat

      - name: SwiftFormat (lint only)
        run: swiftformat --lint .

      - name: SwiftLint
        run: swiftlint

      - name: Select newest Xcode
        # Runner images now ship iOS simulators only for their newest Xcode, so
        # pick it (also keeps the test SDK current with the iOS 26.2 target).
        run: |
          set -euo pipefail
          newest="$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -1 || true)"
          [ -n "$newest" ] && sudo xcode-select -s "$newest/Contents/Developer"
          xcodebuild -version

      - name: Select simulator
        # Hardcoding a device name (e.g. "iPhone 16") breaks whenever the image
        # changes its preinstalled simulators. Pick whatever iPhone exists, and
        # create one from the newest iOS runtime if none are preinstalled.
        run: |
          set -euo pipefail
          pick='import json,sys; d=json.load(sys.stdin)["devices"]; c=[x for rt,l in d.items() if "iOS" in rt for x in l if "iPhone" in x["name"]]; print(c[0]["udid"] if c else "")'
          udid="$(xcrun simctl list devices available -j | python3 -c "$pick")"
          if [ -z "$udid" ]; then
            rt="$(xcrun simctl list runtimes -j | python3 -c 'import json,sys; r=[x["identifier"] for x in json.load(sys.stdin)["runtimes"] if x.get("isAvailable") and "iOS" in x["identifier"]]; print(r[-1] if r else "")')"
            dt="$(xcrun simctl list devicetypes -j | python3 -c 'import json,sys; t=[x["identifier"] for x in json.load(sys.stdin)["devicetypes"] if "iPhone" in x["name"]]; print(t[-1] if t else "")')"
            [ -n "$rt" ] && [ -n "$dt" ] || { echo "::error::No iOS simulator runtime available on this runner"; exit 1; }
            udid="$(xcrun simctl create ci-iphone "$dt" "$rt")"
          fi
          echo "Using simulator $udid"
          echo "DESTINATION=platform=iOS Simulator,id=$udid" >> "$GITHUB_ENV"

      - name: Build for testing
        run: xcodebuild build-for-testing -scheme "$SCHEME" -project "$PROJECT" -destination "$DESTINATION"

      - name: Test
        run: xcodebuild test-without-building -scheme "$SCHEME" -project "$PROJECT" -destination "$DESTINATION"

  # The overlay SwiftPM package (Package.swift) compiles the platform-neutral
  # subset of Shared/ so domain logic builds and tests on Linux dev boxes.
  # This job keeps that subset from rotting; the Swift version matches the
  # toolchain used locally and the one bundled with Xcode on macos-latest.
  linux:
    name: Build & test (Linux SwiftPM)
    runs-on: ubuntu-latest
    container: swift:6.1
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Test
        run: swift test
