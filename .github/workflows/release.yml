# Builds a signed, App Store-ready .ipa, publishes it for download, and can
# upload it straight to TestFlight.
#
# Two ways to run it:
#   * Actions tab -> "Release IPA" -> Run workflow. Tick "publish_testflight"
#     to send the build to TestFlight; otherwise you just get the artifact.
#   * push a tag:  git tag v1.2.0 && git push origin v1.2.0
#     (always: artifact + GitHub Release + TestFlight upload)
#
# The .ipa is uploaded as a workflow artifact ("lead-track-ipa") and, for tag
# builds, attached to a GitHub Release. When publishing, it is uploaded to App
# Store Connect via `xcrun altool` and appears in TestFlight after processing.
# To install on a device, use the TestFlight app (App Store distribution builds
# cannot be sideloaded directly). See docs/RELEASE.md.
#
# One-time setup — add these repository secrets
# (Settings -> Secrets and variables -> Actions). See docs/RELEASE.md for how
# to obtain them from App Store Connect -> Users and Access -> Integrations:
#   APP_STORE_CONNECT_API_KEY_ID      Key ID, e.g. 2X9R4HXF34
#   APP_STORE_CONNECT_API_ISSUER_ID   Issuer ID (a UUID)
#   APP_STORE_CONNECT_API_KEY         Full text of the AuthKey_<KEYID>.p8 file
# The API key MUST have the "Admin" role. Creating the Apple *Distribution*
# certificate via cloud signing requires Admin; an "App Manager"/"Developer" key
# can do development signing (so the Archive step succeeds) but fails Export with
# "Cloud signing permission error". An app record for plastickarma.lead-track
# must exist in App Store Connect; the bundle IDs themselves (app, .widget,
# .watchkitapp) are registered automatically by cloud signing during Archive.
# The fourth, .watchkitapp.widget, requests an app group, which cloud signing
# cannot create — a workflow step pre-registers it (see
# register-watch-widget-bundle-id.rb); assigning the group to that App ID
# stays a one-time manual portal step. Details: docs/RELEASE.md.

name: Release IPA

on:
  workflow_dispatch:
    inputs:
      marketing_version:
        description: "Marketing version override, e.g. 1.2.0 (blank = keep project value)"
        required: false
        type: string
      publish_testflight:
        description: "Upload the build to TestFlight after exporting"
        required: false
        type: boolean
        default: false
      diagnose_signing:
        description: "Print the account's bundle IDs, capabilities & profiles (debug cloud signing)"
        required: false
        type: boolean
        default: false
  push:
    tags:
      - "v*"

# Least privilege: the signing/upload job only reads the repo — xcodebuild
# executes repo-supplied build phases and secrets are in scope there, so it
# must not hold a token that can push. The attach-release job below re-grants
# `contents: write` for itself alone (tag builds' GitHub Release).
permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Archive, sign & export (App Store)
    runs-on: macos-latest
    env:
      SCHEME: "lead track"
      PROJECT: "lead track.xcodeproj"

    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      - name: Install linters (pinned)
        # The archive runs the project's SwiftLint/SwiftFormat build phases,
        # which use whatever binaries are on PATH. Without this step that
        # means the runner image's floating Homebrew versions — and an image
        # rollout (macos-26-arm64 20260715) shipped a swiftformat that fails
        # the phase with no output, breaking the archive with no code change.
        # Pin the same verified versions ios.yml uses so the phases behave
        # identically in CI and release. Keep versions in sync with ios.yml
        # and CLAUDE.md "Linting".
        env:
          SWIFTLINT_VERSION: 0.63.3
          SWIFTLINT_SHA256: fb045e85e7cb3374f42a4840b6b85a0106302afa69035c0c6f29af4a44c810b6
          SWIFTFORMAT_VERSION: 0.61.1
          SWIFTFORMAT_SHA256: b990400779aceb7d7020796eb9ba814d4480543f671d38fc0ff48cb72f04c584
        run: |
          set -euo pipefail
          tools="$RUNNER_TEMP/lint-tools"
          mkdir -p "$tools" && cd "$tools"
          curl -fsSL -o portable_swiftlint.zip \
            "https://github.com/realm/SwiftLint/releases/download/${SWIFTLINT_VERSION}/portable_swiftlint.zip"
          echo "${SWIFTLINT_SHA256}  portable_swiftlint.zip" | shasum -a 256 -c -
          unzip -o -q portable_swiftlint.zip swiftlint
          curl -fsSL -o swiftformat.zip \
            "https://github.com/nicklockwood/SwiftFormat/releases/download/${SWIFTFORMAT_VERSION}/swiftformat.zip"
          echo "${SWIFTFORMAT_SHA256}  swiftformat.zip" | shasum -a 256 -c -
          unzip -o -q swiftformat.zip swiftformat
          chmod +x swiftlint swiftformat
          echo "$tools" >> "$GITHUB_PATH"
          ./swiftlint --version && ./swiftformat --version

      - name: Select newest Xcode
        # App Store uploads require the build to use a current SDK (iOS 26 / Xcode
        # 26). The runner's default Xcode can be older, so pick the newest installed.
        run: |
          set -euo pipefail
          echo "Installed Xcodes:"; ls -d /Applications/Xcode*.app 2>/dev/null || true
          newest="$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -1 || true)"
          if [ -n "$newest" ]; then
            echo "Selecting $newest"
            sudo xcode-select -s "$newest/Contents/Developer"
          fi
          xcodebuild -version

      - name: Set up output paths
        # runner.temp isn't available in job-level env, so resolve paths here.
        run: |
          echo "ARCHIVE_PATH=$RUNNER_TEMP/lead-track.xcarchive" >> "$GITHUB_ENV"
          echo "EXPORT_DIR=$RUNNER_TEMP/export" >> "$GITHUB_ENV"
          echo "API_KEY_PATH=$RUNNER_TEMP/AuthKey.p8" >> "$GITHUB_ENV"

      - name: Verify signing secrets are present
        env:
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
          API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
        run: |
          set -u
          missing=0
          for v in KEY_ID ISSUER_ID API_KEY; do
            if [ -z "${!v:-}" ]; then
              echo "::error::Missing required secret backing \$$v — add the App Store Connect API key secrets (see this workflow's header / docs/RELEASE.md) and re-run."
              missing=1
            fi
          done
          [ "$missing" -eq 0 ]

      - name: Install App Store Connect API key
        env:
          API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
        run: |
          set -euo pipefail
          printf '%s' "$API_KEY" > "$API_KEY_PATH"
          if ! head -1 "$API_KEY_PATH" | grep -q "BEGIN PRIVATE KEY"; then
            echo "::error::APP_STORE_CONNECT_API_KEY is not a valid .p8 — paste the full text of the AuthKey_<KEYID>.p8 file, including the BEGIN/END lines."
            exit 1
          fi

      - name: Resolve version & build number
        env:
          INPUT_MKT: ${{ inputs.marketing_version }}
        run: |
          set -euo pipefail
          # CFBundleVersion must be unique per marketing version; App Store Connect
          # rejects a build that collides with an existing one. github.run_number
          # repeats when a run is *re-run* (only run_attempt changes), so derive the
          # build from a monotonic UTC timestamp instead — always unique and higher
          # than the last, and within CFBundleVersion's uint32 limit until ~2106.
          BUILD="$(date -u +%s)"
          MKT="$INPUT_MKT"
          if [ -z "$MKT" ] && [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            MKT="${GITHUB_REF_NAME#v}"
          fi
          echo "BUILD_NUMBER=$BUILD" >> "$GITHUB_ENV"
          echo "MARKETING_VERSION=$MKT" >> "$GITHUB_ENV"
          echo "Build number: $BUILD ; marketing version override: '${MKT:-<none>}'"

      - name: Register watch widget bundle ID
        # Cloud signing can't create App IDs whose entitlements include app
        # groups (API-key auth is rejected for that write), so pre-register
        # the bundle ID via the ASC API. Group assignment remains a one-time
        # manual portal step.
        continue-on-error: true
        env:
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
        run: ruby .github/scripts/register-watch-widget-bundle-id.rb

      - name: Diagnose bundle IDs & profiles
        # Read-only: prints the account's bundle IDs, capabilities, and
        # provisioning profiles to debug cloud-signing failures. Off by
        # default — tick "diagnose_signing" when signing breaks.
        if: ${{ inputs.diagnose_signing }}
        continue-on-error: true
        env:
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
        run: ruby .github/scripts/diagnose-bundle-ids.rb

      - name: Free up signing certificates
        # Cloud signing mints a new Apple Development certificate on every run
        # (each CI VM starts with an empty keychain). Apple caps certificates
        # per account, so Archive eventually fails with "maximum number of
        # certificates". Revoke existing development certs via the App Store
        # Connect API first; Archive then creates one fresh cert under the cap.
        # Best-effort and never fatal; distribution certs are left untouched.
        continue-on-error: true
        env:
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
        run: ruby .github/scripts/revoke-dev-certs.rb

      - name: Archive
        env:
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
        run: |
          set -euo pipefail
          EXTRA=("CURRENT_PROJECT_VERSION=${BUILD_NUMBER}")
          if [ -n "${MARKETING_VERSION}" ]; then
            EXTRA+=("MARKETING_VERSION=${MARKETING_VERSION}")
          fi
          xcodebuild archive \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath "$ARCHIVE_PATH" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$API_KEY_PATH" \
            -authenticationKeyID "$KEY_ID" \
            -authenticationKeyIssuerID "$ISSUER_ID" \
            "${EXTRA[@]}"

      - name: Export .ipa
        env:
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
        run: |
          set -euo pipefail
          LOG="$RUNNER_TEMP/export.log"
          : > "$LOG"
          export_ipa () {
            xcodebuild -exportArchive \
              -archivePath "$ARCHIVE_PATH" \
              -exportPath "$EXPORT_DIR" \
              -exportOptionsPlist "$1" \
              -allowProvisioningUpdates \
              -authenticationKeyPath "$API_KEY_PATH" \
              -authenticationKeyID "$KEY_ID" \
              -authenticationKeyIssuerID "$ISSUER_ID" 2>&1 | tee -a "$LOG"
            return "${PIPESTATUS[0]}"
          }
          ok=0
          if ! export_ipa "ExportOptions.plist"; then
            echo "::warning::export with method 'app-store-connect' failed; retrying with legacy 'app-store'"
            sed 's/app-store-connect/app-store/' ExportOptions.plist > "$RUNNER_TEMP/ExportOptions-legacy.plist"
            rm -rf "$EXPORT_DIR"
            export_ipa "$RUNNER_TEMP/ExportOptions-legacy.plist" || ok=1
          fi
          if [ "$ok" -ne 0 ]; then
            if grep -q "Cloud signing permission error" "$LOG"; then
              echo "::error::Export hit 'Cloud signing permission error'. The App Store Connect API key must have the **Admin** role so Xcode can create the Apple Distribution certificate via cloud signing. An App Manager/Developer key only does development signing (the Archive step still succeeds). Recreate the key with the Admin role, update the APP_STORE_CONNECT_API_* secrets, and re-run. See docs/RELEASE.md."
            fi
            exit 1
          fi
          shopt -s nullglob
          ipas=("$EXPORT_DIR"/*.ipa)
          if [ "${#ipas[@]}" -eq 0 ]; then
            echo "::error::export succeeded but no .ipa was found in $EXPORT_DIR"
            exit 1
          fi
          echo "IPA_PATH=${ipas[0]}" >> "$GITHUB_ENV"
          echo "Exported: ${ipas[0]}"

      - name: Upload .ipa artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: lead-track-ipa
          path: ${{ runner.temp }}/export/*.ipa
          if-no-files-found: error
          retention-days: 30

      - name: Expire builds stuck in Beta App Review
        # Beta App Review allows only one build per version in review at a time,
        # so a previously-submitted build still waiting/in review blocks
        # submitting this one ("You can only submit one build from version X…").
        # Expire those first to free the slot. Best-effort: only touches builds
        # of the version being uploaded that are in review (never an approved
        # build testers use, never another version's pending build) and never
        # fails the job.
        if: ${{ inputs.publish_testflight || startsWith(github.ref, 'refs/tags/') }}
        continue-on-error: true
        env:
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
        run: |
          set -euo pipefail
          # The review lock is per marketing version, so scope the expiry to
          # the version this run uploads. MARKETING_VERSION may be blank
          # (project default), so fall back to the version actually baked
          # into the archived app; the script skips when it stays unknown.
          version="${MARKETING_VERSION}"
          if [ -z "$version" ]; then
            version="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' \
              "$ARCHIVE_PATH"/Products/Applications/*.app/Info.plist 2>/dev/null || true)"
          fi
          RELEASE_VERSION="$version" ruby .github/scripts/expire-builds-in-review.rb

      - name: Upload to TestFlight
        # Runs when dispatched with publish_testflight=true, or on any v* tag push.
        if: ${{ inputs.publish_testflight || startsWith(github.ref, 'refs/tags/') }}
        env:
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
        run: |
          set -euo pipefail
          # altool locates the key by name under ~/.appstoreconnect/private_keys.
          KEYS_DIR="$HOME/.appstoreconnect/private_keys"
          mkdir -p "$KEYS_DIR"
          cp "$API_KEY_PATH" "$KEYS_DIR/AuthKey_${KEY_ID}.p8"
          trap 'rm -f "$KEYS_DIR/AuthKey_${KEY_ID}.p8"' EXIT
          echo "Uploading $IPA_PATH to App Store Connect…"
          log="$RUNNER_TEMP/upload.log"
          # altool's exit code is unreliable — this version returns 0 even when the
          # upload is rejected — so judge success from its output. Turn pipefail off
          # so tee's 0 doesn't trip set -e; read altool's own code via PIPESTATUS too.
          set +o pipefail
          xcrun altool --upload-app \
            --type ios \
            --file "$IPA_PATH" \
            --apiKey "$KEY_ID" \
            --apiIssuer "$ISSUER_ID" 2>&1 | tee "$log"
          rc="${PIPESTATUS[0]}"
          set -o pipefail
          if [ "$rc" -ne 0 ] || grep -qiE "UPLOAD FAILED|Failed to upload package" "$log"; then
            if grep -qi "must be built with the iOS .* SDK" "$log"; then
              echo "::error::Upload rejected: build used too old an SDK. App Store requires the iOS 26 SDK (Xcode 26). The 'Select newest Xcode' step picks the newest Xcode on the runner; if that is still too old, the runner image lacks Xcode 26 — pin a newer 'runs-on' image. See docs/RELEASE.md."
            elif grep -qi "closed for new build submissions\|must contain a higher version" "$log"; then
              echo "::error::Upload rejected: this version already exists on App Store Connect. Re-run with a higher marketing version (e.g. -f marketing_version=1.0.1, or push a higher v* tag). See docs/RELEASE.md."
            elif grep -qi "No suitable application records\|app.*not.*found\|cannot be found" "$log"; then
              echo "::error::Upload failed: no matching app record. Create the app for bundle ID 'plastickarma.lead-track' in App Store Connect (My Apps) first, then re-run. See docs/RELEASE.md."
            else
              echo "::error::TestFlight upload failed — see the altool output above."
            fi
            exit 1
          fi
          echo "PUBLISHED_TESTFLIGHT=1" >> "$GITHUB_ENV"
          echo "Uploaded — the build appears in TestFlight once App Store Connect finishes processing."

      - name: Summary
        run: |
          {
            echo "## ✅ App Store .ipa ready"
            echo ""
            echo "- **Version**: \`${MARKETING_VERSION:-project default}\` (build \`${BUILD_NUMBER}\`)"
            echo "- **Download**: the **lead-track-ipa** artifact below (tag builds also attach it to the Release)."
            if [ "${PUBLISHED_TESTFLIGHT:-0}" = "1" ]; then
              echo "- **TestFlight**: uploaded to App Store Connect ✅ — it appears under TestFlight once processing finishes, then install it via the TestFlight app on your iPhone."
            else
              echo "- **TestFlight**: not uploaded. Re-run with **publish_testflight** ticked (or push a \`v*\` tag) to send it to TestFlight."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  # Tag builds only. A separate job so `contents: write` is scoped to exactly
  # this step: the signing job above runs xcodebuild (repo-supplied build
  # phases) with the ASC key in scope and must not hold a write token.
  attach-release:
    name: Attach .ipa to GitHub Release
    if: startsWith(github.ref, 'refs/tags/')
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the GitHub Release and attach the .ipa
    steps:
      - name: Download .ipa artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: lead-track-ipa
          path: ${{ runner.temp }}/ipa

      - name: Attach .ipa to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          ipas=("$RUNNER_TEMP"/ipa/*.ipa)
          if [ "${#ipas[@]}" -eq 0 ]; then
            echo "::error::the lead-track-ipa artifact contained no .ipa"
            exit 1
          fi
          gh release create "$GITHUB_REF_NAME" "${ipas[0]}" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" --generate-notes \
          || gh release upload "$GITHUB_REF_NAME" "${ipas[0]}" \
            --repo "$GITHUB_REPOSITORY" --clobber
