version: 1
project: lead track.xcodeproj
target: lead track
swiftVersion: 6.4.0
skippedBuildScripts:
  SwiftLint: Validation-only phase; run the repository's lint gate separately.
  SwiftFormat Check: Validation-only phase; run the repository's formatting gate separately.
appStoreConnect:
  appID: "6761788241"
  locale: en-US
  testNotes: >-
    Optional Obsidian/GitHub backend: connect a private vault subdirectory in
    Settings, browse generated Bases and linked Markdown, edit descriptions in
    Obsidian and sync them back. Verify offline edits, conflict choices,
    disconnect/reconnect, record deletion and photo preservation. Check that
    existing stores migrate without data loss, and verify timer notifications,
    Live Activities, Watch sync, widgets, sharing and Health permissions.
