appStoreConnect:
  appID: "6761788241"
  locale: en-US
  testNotes: >-
    Diagnostic build for the unresolved "Session requires a metric" failure.
    Keep the existing GitHub connection and tap Sync Now. Select and copy the
    complete error, including its phase, session/project IDs and backlink IDs,
    or send a screenshot of the full message. This identifies whether the
    failure is in saved local data, snapshot validation, a post-publication
    recheck or local apply. No relationship repair or validation bypass is
    included; sync may still fail. Do not disconnect, reset or delete records.
    Also check ordinary recording, Watch sync, widgets and sharing.
