  testNotes: >-
    Refines the Today screen with aligned headings, compact day navigation,
    clearer light-mode controls and a visible Log Effort action. Check light
    and dark appearance and larger text sizes. With every group collapsed,
    open Log Effort, record a count or duration and mark/undo a binary habit;
    verify configured Log +1 behavior. Browse an earlier day and check that
    entries land on that day, then return to Today. Cancel an entry and confirm
    no record was added. Health-linked and archived metrics must not appear in
    the picker. Check ordinary timers, widgets, Watch sync and vault sync.
