appStoreConnect:
  appID: "6761788241"
  locale: en-US
  testNotes: >-
    This build fixes "Session requires a metric" for existing data points whose
    metric is linked through a project. Retry Sync Now on the existing GitHub
    connection. Confirm all points remain and their identities, timestamps,
    values and projects survive a round trip. Change a value in Obsidian, sync
    it back, and check that no duplicate point appears. Invalid or conflicting
    owners and multiple running timers must still stop sync without dropping
    records. Also verify token refresh, manual token connections, offline
    recording, Watch sync, widgets and sharing.
